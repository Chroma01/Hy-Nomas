<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">LoRA fine-tuning and checkpoint merge</title>
  <desc id="desc">Fine-tune a non-distilled checkpoint with segment forcing to obtain LoRA weights. Merge those weights with the distilled checkpoint to produce a merged checkpoint.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="250" rx="12" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 220 65 H 410"/>
    <path d="M 610 65 H 660 Q 680 65 680 85 V 96"/>
    <path d="M 610 185 H 660 Q 680 185 680 165 V 154"/>
    <path d="M 710 125 H 770"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5">
    <rect x="20" y="35" width="200" height="60" rx="8" fill="#f8fafc"/>
    <rect x="410" y="35" width="200" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="410" y="155" width="200" height="60" rx="8" fill="#f8fafc"/>
    <rect x="780" y="95" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="680" cy="125" r="28" fill="#ffffff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#0f172a" font-size="17">
    <text x="120" y="60">Non-distilled</text>
    <text x="120" y="81">checkpoint</text>
    <text x="510" y="71">LoRA weights</text>
    <text x="510" y="180">Distilled</text>
    <text x="510" y="201">checkpoint</text>
    <text x="880" y="120">Merged checkpoint</text>
    <text x="880" y="141" font-size="14" fill="#475569">for inference</text>
    <text x="680" y="134" font-size="30">+</text>
    <text x="680" y="205" font-size="15" fill="#475569">Merge</text>
    <text x="315" y="30" font-size="14" fill="#475569">Segment forcing</text>
    <text x="315" y="49" font-size="14" fill="#475569">fine-tuning</text>
  </g>
</svg>
