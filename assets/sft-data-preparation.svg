<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="150" viewBox="0 0 1120 150" role="img" aria-labelledby="title desc">
  <title id="title">SFT Data Preparation</title>
  <desc id="desc">Local videos proceed through VAE encoding, event segmentation, and captioning with Kimi-K3 to form an SFT dataset. This is the preparation workflow; the current script interfaces are documented separately.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="150" rx="12" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 170 75 H 208"/>
    <path d="M 400 75 H 438"/>
    <path d="M 630 75 H 668"/>
    <path d="M 880 75 H 918"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5">
    <rect x="20" y="40" width="150" height="70" rx="8" fill="#f8fafc"/>
    <rect x="220" y="40" width="180" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="450" y="40" width="180" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="680" y="40" width="200" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="930" y="40" width="170" height="70" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
    <text x="95" y="81">Local videos</text>
    <text x="310" y="20" font-size="13" fill="#475569">STEP 1</text>
    <text x="310" y="81">VAE Encoding</text>
    <text x="540" y="20" font-size="13" fill="#475569">STEP 2</text>
    <text x="540" y="69">Event</text><text x="540" y="92">Segmentation</text>
    <text x="780" y="20" font-size="13" fill="#475569">STEP 3</text>
    <text x="780" y="69">Captioning</text><text x="780" y="92">with Kimi-K3</text>
    <text x="1015" y="69">SFT Dataset</text><text x="1015" y="92" font-size="14" fill="#475569">Arrow / Parquet</text>
  </g>
</svg>
