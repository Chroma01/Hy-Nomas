<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">World preview placeholder</title>
  <desc id="desc">An abstract world preview shown before the first generated video is ready</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="37%" r="73%">
      <stop offset="0" stop-color="#6d6253"/>
      <stop offset=".5" stop-color="#35312a"/>
      <stop offset="1" stop-color="#11110f"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#25241f"/>
      <stop offset="1" stop-color="#0a0a09"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#d9d2c3" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="342" r="123" fill="#d9ff70" opacity=".14" filter="url(#blur)"/>
  <circle cx="800" cy="342" r="75" fill="#d7fb76" opacity=".9"/>
  <path d="M0 590 285 505 466 554 692 432 889 536 1062 451 1314 564 1600 479V900H0Z" fill="#171713"/>
  <path d="M0 645 216 562 453 641 678 527 925 644 1157 549 1377 632 1600 560V900H0Z" fill="url(#ground)"/>
  <rect y="480" width="1600" height="420" fill="url(#grid)" opacity=".7"/>
  <path d="M800 900V620M470 900l222-280M1130 900 908 620M0 790h1600M0 690h1600" stroke="#f4f1e9" stroke-opacity=".07"/>
  <g fill="none" stroke="#f4f1e9">
    <path d="M684 373h-58v58M916 373h58v58M684 547h-58v-58M916 547h58v-58" stroke-opacity=".36" stroke-width="2"/>
    <circle cx="800" cy="460" r="3" fill="#ff6f51" stroke="none"/>
    <path d="M800 436v48M776 460h48" stroke="#ff6f51" stroke-opacity=".68"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="800" y="758" fill="#f4f1e9" font-size="17" letter-spacing="5">WORLD PREVIEW</text>
    <text x="800" y="792" fill="#aaa69d" font-size="11" letter-spacing="2">YOUR GENERATED WORLD WILL APPEAR HERE</text>
  </g>
</svg>
