<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#11130f" />
    <meta
      name="description"
      content="Hy-Nomas interactive video generation and world model inference."
    />
    <link rel="icon" type="image/png" href="./hunyuan-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('nomas-world-engine-theme') === 'light'
            ? 'light'
            : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>Hy-Nomas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
