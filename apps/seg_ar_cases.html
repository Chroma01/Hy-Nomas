<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Attempts · Live</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d100d;
      --panel: rgba(25, 29, 24, .92);
      --panel-2: #20251e;
      --line: rgba(224, 235, 211, .13);
      --text: #f3f5ee;
      --muted: #a7b09e;
      --accent: #d9ff76;
      --good: #9ee493;
      --bad: #ff8a7a;
      --wait: #f4cf72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); background:
      radial-gradient(circle at 12% 0%, rgba(109, 132, 73, .22), transparent 34rem),
      radial-gradient(circle at 95% 10%, rgba(83, 111, 94, .16), transparent 30rem),
      var(--bg);
      font-family: TencentSans, Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 20; display: flex; gap: 18px;
      align-items: center; justify-content: space-between; padding: 18px 28px;
      border-bottom: 1px solid var(--line); backdrop-filter: blur(18px);
      background: rgba(13, 16, 13, .82);
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 14px var(--good); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    input, select, button {
      min-height: 38px; border: 1px solid var(--line); border-radius: 10px;
      padding: 0 12px; color: var(--text); background: var(--panel-2);
      outline: none;
    }
    button { cursor: pointer; }
    input { width: min(330px, 45vw); }
    main { max-width: 1680px; margin: 0 auto; padding: 24px 28px 48px; }
    .summary { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 18px;
    }
    article {
      min-width: 0; overflow: hidden; border: 1px solid var(--line);
      border-radius: 16px; background: var(--panel); box-shadow: 0 14px 45px rgba(0,0,0,.18);
    }
    video { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #050605; }
    .empty-video {
      display: grid; place-items: center; width: 100%; aspect-ratio: 16/9;
      color: var(--muted); background: linear-gradient(135deg, #171b16, #0b0d0b);
    }
    .content { padding: 15px; }
    .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .pill {
      padding: 4px 8px; border-radius: 999px; font-size: 11px;
      color: var(--muted); background: rgba(255,255,255,.055); border: 1px solid var(--line);
    }
    .pill.status-succeeded { color: var(--good); }
    .pill.status-failed { color: var(--bad); }
    .pill.status-running, .pill.status-queued, .pill.status-enhancing { color: var(--wait); }
    h2 { margin: 0 0 6px; font-size: 16px; line-height: 1.35; }
    .session-id {
      margin: 0 0 12px; overflow: hidden; color: #788171;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .environment, .action, .error { margin: 0 0 10px; font-size: 13px; line-height: 1.55; color: var(--muted); }
    .error { color: var(--bad); }
    details { margin-top: 9px; border-top: 1px solid var(--line); padding-top: 9px; }
    summary { cursor: pointer; color: var(--accent); font-size: 12px; }
    .turn-list {
      display: grid; gap: 8px; margin-top: 15px; padding-top: 13px;
      border-top: 1px solid var(--line);
    }
    .turn {
      margin: 0; padding: 0 11px; overflow: hidden;
      border: 1px solid var(--line); border-radius: 11px;
      background: rgba(8, 10, 8, .34);
    }
    .turn > summary {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px; align-items: center; min-height: 45px; color: var(--text);
      list-style: none;
    }
    .turn > summary::-webkit-details-marker { display: none; }
    .turn-number {
      display: grid; place-items: center; width: 23px; height: 23px;
      border-radius: 50%; color: #11140e; background: var(--accent);
      font-size: 11px; font-weight: 800;
    }
    .turn-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .turn-state { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    .turn-state.status-succeeded { color: var(--good); }
    .turn-state.status-failed { color: var(--bad); }
    .turn-state.status-running,
    .turn-state.status-queued,
    .turn-state.status-enhancing { color: var(--wait); }
    .turn-body { padding: 0 0 11px 33px; }
    .turn-actions { display: flex; gap: 8px; margin: 8px 0; }
    .turn-actions button {
      min-height: 30px; border: 1px solid var(--line); border-radius: 8px;
      padding: 0 10px; color: var(--text); background: var(--panel-2);
      cursor: pointer;
    }
    .turn-actions button:hover { border-color: rgba(217, 255, 118, .5); }
    .case-actions {
      display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
      margin: 2px 0 14px;
    }
    .case-actions button { min-height: 34px; }
    .case-actions .primary {
      color: #11140e; border-color: var(--accent); background: var(--accent);
      font-weight: 800;
    }
    .case-actions .gallery-added,
    .case-actions .gallery-added:disabled {
      color: var(--good); border-color: rgba(158, 228, 147, .42);
      background: rgba(158, 228, 147, .09); cursor: default;
      font-weight: 800; opacity: 1;
    }
    .action-status { min-height: 18px; color: var(--muted); font-size: 12px; }
    .action-status a { margin-left: 6px; color: var(--accent); }
    .action-status.error { margin: 0; }
    .focused-case {
      border-color: rgba(217, 255, 118, .72);
      box-shadow: 0 0 0 2px rgba(217, 255, 118, .14), 0 18px 55px rgba(0,0,0,.24);
    }
    dialog {
      width: min(520px, calc(100vw - 30px)); padding: 0; color: var(--text);
      border: 1px solid rgba(224, 235, 211, .2); border-radius: 18px;
      background: #181c16; box-shadow: 0 28px 90px rgba(0,0,0,.54);
    }
    dialog::backdrop { background: rgba(3, 5, 3, .72); backdrop-filter: blur(4px); }
    .download-dialog { padding: 22px; }
    .download-dialog h2 { margin-bottom: 6px; }
    .download-dialog > p { margin: 0 0 17px; color: var(--muted); font-size: 13px; }
    .download-options { display: grid; gap: 10px; }
    .download-option {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px; align-items: center; padding: 14px; cursor: pointer;
      border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2);
    }
    .download-option:has(input:checked) {
      border-color: rgba(217, 255, 118, .72);
      box-shadow: inset 0 0 0 1px rgba(217, 255, 118, .18);
    }
    .download-option input { width: auto; min-height: auto; accent-color: var(--accent); }
    .download-option strong, .download-option small { display: block; }
    .download-option small { margin-top: 4px; color: var(--muted); }
    .recommended {
      padding: 4px 7px; border-radius: 999px; color: #11140e;
      background: var(--accent); font-size: 9px; font-weight: 900;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .dialog-actions {
      display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px;
    }
    button:disabled { cursor: wait; opacity: .58; }
    pre {
      max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word;
      color: #dce7d3; background: #10130f; border-radius: 10px; padding: 11px;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .empty { padding: 80px 20px; text-align: center; color: var(--muted); }
    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 22px;
    }
    .pagination span { min-width: 110px; text-align: center; color: var(--muted); font-size: 13px; }
    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; padding: 16px; }
      main { padding: 18px 16px 40px; }
      .grid { grid-template-columns: 1fr; }
      input { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>World Attempts</h1>
      <div class="live"><span class="dot"></span><span id="liveText">Live · refreshing</span></div>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search user, prompt or session" />
      <select id="status">
        <option value="">All statuses</option>
        <option value="succeeded">Succeeded</option>
        <option value="failed">Failed</option>
        <option value="running">Running</option>
        <option value="queued">Queued</option>
        <option value="enhancing">Enhancing</option>
      </select>
    </div>
  </header>
  <main>
    <div class="summary" id="summary">Loading attempts…</div>
    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" hidden>No matching attempts yet.</div>
    <nav class="pagination" aria-label="Cases pages">
      <button id="previousPage" type="button">Previous</button>
      <span id="pageText">Page 1 / 1</span>
      <button id="nextPage" type="button">Next</button>
    </nav>
  </main>
  <dialog id="downloadDialog">
    <form class="download-dialog" method="dialog">
      <h2>Download case video</h2>
      <p>Choose the presentation you want to save.</p>
      <div class="download-options">
        <label class="download-option">
          <input name="downloadMode" type="radio" value="overlay" checked />
          <span>
            <strong>With overlay</strong>
            <small>Prompt/camera overlay burned into the MP4.</small>
          </span>
          <span class="recommended">Recommended</span>
        </label>
        <label class="download-option">
          <input name="downloadMode" type="radio" value="original" />
          <span>
            <strong>Original video</strong>
            <small>Clean MP4 without prompt or camera overlays.</small>
          </span>
        </label>
      </div>
      <p class="action-status" id="downloadStatus"></p>
      <div class="dialog-actions">
        <button id="cancelDownload" type="button">Cancel</button>
        <button id="confirmDownload" class="primary" type="button">Download with overlay</button>
      </div>
    </form>
  </dialog>
  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    const liveText = document.getElementById('liveText');
    const search = document.getElementById('search');
    const status = document.getElementById('status');
    const previousPage = document.getElementById('previousPage');
    const nextPage = document.getElementById('nextPage');
    const pageText = document.getElementById('pageText');
    const downloadDialog = document.getElementById('downloadDialog');
    const downloadStatus = document.getElementById('downloadStatus');
    const cancelDownload = document.getElementById('cancelDownload');
    const confirmDownload = document.getElementById('confirmDownload');
    const downloadModes = [...document.querySelectorAll('input[name="downloadMode"]')];
    const appRoot = window.location.pathname.replace(/cases\/?$/, '');
    let digest = '';
    let debounce;
    let refreshTimer;
    let refreshInFlight = false;
    let refreshPending = false;
    let currentPage = 1;
    let pendingDownload;
    const galleryStates = new Map();
    const pageSize = 24;
    const refreshIntervalMs = 15000;
    let latestData = {
      items: [],
      total: 0,
      session_total: 0,
      page: 1,
      pages: 0,
    };

    const fmt = value => {
      if (!value) return '—';
      const date = new Date(Number(value) * 1000);
      return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString();
    };
    const pretty = value => {
      if (value == null || value === '') return '—';
      if (typeof value !== 'string') return JSON.stringify(value, null, 2);
      try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
    };
    const node = (tag, className, text) => {
      const value = document.createElement(tag);
      if (className) value.className = className;
      if (text != null) value.textContent = text;
      return value;
    };
    const details = (label, value) => {
      const root = document.createElement('details');
      const title = document.createElement('summary');
      title.textContent = label;
      root.append(title, node('pre', '', pretty(value)));
      return root;
    };
    const mediaUrl = value =>
      new URL(`${appRoot}${String(value || '').replace(/^\/+/, '')}`, location.origin).href;
    const apiUrl = value =>
      new URL(`${appRoot}${String(value || '').replace(/^\/+/, '')}`, location.origin).href;
    const casePath = item =>
      `v1/cases/${encodeURIComponent(item.source_id)}/${encodeURIComponent(item.job_id)}`;
    const focusedCase = () =>
      new URLSearchParams(window.location.search).get('case') || window.location.hash.slice(1);
    const copyText = async value => {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const input = document.createElement('textarea');
      input.value = value;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
    };
    const triggerDownload = (value, filename) => {
      const anchor = document.createElement('a');
      anchor.href = apiUrl(value);
      anchor.download = filename;
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    };
    const requestJson = async (path, body) => {
      const response = await fetch(apiUrl(path), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      let payload = {};
      try {
        payload = await response.json();
      } catch {
        // Preserve the HTTP status when an upstream failure has no JSON body.
      }
      if (!response.ok) {
        const error = new Error(payload.detail || `HTTP ${response.status}`);
        error.status = response.status;
        throw error;
      }
      return payload;
    };
    const applyGalleryState = (button, actionStatus, state) => {
      const complete = state?.status === 'added' || state?.status === 'duplicate';
      button.classList.toggle('gallery-added', complete);
      button.disabled = state?.status === 'adding' || complete;
      button.setAttribute(
        'aria-busy',
        state?.status === 'adding' ? 'true' : 'false',
      );
      if (state?.status === 'adding') {
        button.textContent = 'Adding to gallery…';
        actionStatus.className = 'action-status';
        actionStatus.textContent = 'Adding this case to the gallery…';
      } else if (state?.status === 'added') {
        button.textContent = 'Added to gallery';
        actionStatus.className = 'action-status';
        actionStatus.textContent = 'Added to gallery.';
      } else if (state?.status === 'duplicate') {
        button.textContent = 'Added to gallery';
        actionStatus.className = 'action-status';
        actionStatus.textContent = 'Already in gallery.';
      } else {
        button.textContent = 'Add to gallery';
        actionStatus.className = state?.status === 'failed'
          ? 'action-status error'
          : 'action-status';
        actionStatus.textContent = state?.status === 'failed'
          ? `Add to gallery failed · ${state.message}`
          : '';
      }
    };

    const attemptTime = item =>
      Number(item.updated_at || item.created_at || 0);

    const actionText = item => {
      const input = item.prompts?.original_user_input || {};
      const originals = item.prompts?.original_user_prompts || [];
      return input.action
        || item.prompts?.carry_user_prompt
        || originals.at(-1)
        || (input.environment_description ? 'Create world' : 'Generation');
    };

    function groupSessions(items) {
      const grouped = new Map();
      for (const item of items) {
        const key = item.session_id || item.job_id;
        if (!grouped.has(key)) {
          grouped.set(key, {
            user_id: item.user_id || '_unknown_user',
            session_id: item.session_id || item.job_id,
            attempts: [],
          });
        }
        const session = grouped.get(key);
        session.attempts.push(item);
        if (
          session.user_id === '_unknown_user'
          && item.user_id
          && item.user_id !== '_unknown_user'
        ) {
          session.user_id = item.user_id;
        }
      }
      return [...grouped.values()].map(session => {
        session.attempts.sort((a, b) => attemptTime(a) - attemptTime(b));
        session.latest = session.attempts.at(-1);
        session.latestVideo = [...session.attempts]
          .reverse()
          .find(item => item.video_url);
        session.input = session.attempts
          .map(item => item.prompts?.original_user_input)
          .find(input => input && Object.keys(input).length) || {};
        session.slots = [...new Set(
          session.attempts.map(item => item.slot_id).filter(Boolean),
        )];
        session.sources = [...new Set(
          session.attempts
            .map(item => item.source_label)
            .filter(Boolean),
        )];
        session.updated_at = attemptTime(session.latest);
        return session;
      }).sort((a, b) => b.updated_at - a.updated_at);
    }

    function render() {
      const sessions = groupSessions(latestData.items || []);
      grid.replaceChildren();
      empty.hidden = sessions.length > 0;
      summary.textContent = `${latestData.session_total} matching sessions · ${latestData.total} attempts indexed · updates every 15 seconds`;
      const pages = Math.max(1, Number(latestData.pages || 0));
      pageText.textContent = `Page ${latestData.page || 1} / ${pages}`;
      previousPage.disabled = (latestData.page || 1) <= 1;
      nextPage.disabled = !latestData.pages || latestData.page >= latestData.pages;
      for (const session of sessions) {
        const card = document.createElement('article');
        const selected = session.latestVideo || session.latest;
        card.id = `case-${selected?.source_id || ''}-${selected?.job_id || ''}`;
        if (`${selected?.source_id}:${selected?.job_id}` === focusedCase()) {
          card.classList.add('focused-case');
        }
        if (session.latestVideo?.video_url) {
          const video = document.createElement('video');
          video.src = mediaUrl(session.latestVideo.video_url);
          video.controls = true;
          video.preload = 'metadata';
          video.playsInline = true;
          video.addEventListener('error', () => {
            if (card.querySelector('.video-error')) return;
            const message = node(
              'p',
              'error video-error',
              'Video failed to load. Click “Play this result” to retry.',
            );
            card.append(message);
          });
          card.append(video);
          card._video = video;
        } else {
          card.append(node(
            'div',
            'empty-video',
            session.latest?.status === 'failed' ? 'Generation failed' : 'Generating…',
          ));
        }
        const body = node('div', 'content');
        const meta = node('div', 'meta');
        meta.append(
          node('span', `pill status-${session.latest?.status}`, session.latest?.status || 'unknown'),
          node('span', 'pill', session.user_id),
          ...session.sources.map(source => node('span', 'pill', source)),
          node('span', 'pill', session.slots.join(', ') || 'unknown slot'),
          node('span', 'pill', `${session.attempts.length} turn${session.attempts.length === 1 ? '' : 's'}`),
          node('span', 'pill', fmt(session.updated_at)),
        );
        const input = session.input;
        const originals = session.attempts
          .flatMap(item => item.prompts?.original_user_prompts || []);
        const title = input.subject_description || originals[0] || 'Untitled world';
        body.append(meta, node('h2', '', title));
        body.append(node('p', 'session-id', session.session_id));
        if (input.environment_description) body.append(node('p', 'environment', input.environment_description));
        if (session.latestVideo?.video_url) {
          const actions = node('div', 'case-actions');
          const share = node('button', '', 'Share');
          const download = node('button', 'primary', 'Download');
          const addToGallery = node('button', '', 'Add to gallery');
          const actionStatus = node('span', 'action-status', '');
          const galleryKey = casePath(session.latestVideo);
          share.type = 'button';
          download.type = 'button';
          addToGallery.type = 'button';
          actionStatus.setAttribute('aria-live', 'polite');
          applyGalleryState(
            addToGallery,
            actionStatus,
            galleryStates.get(galleryKey),
          );
          share.addEventListener('click', async () => {
            share.disabled = true;
            actionStatus.className = 'action-status';
            actionStatus.textContent = 'Creating read-only link…';
            try {
              const payload = await requestJson(
                `${casePath(session.latestVideo)}/shares`,
                { theme: 'dark' },
              );
              const url = apiUrl(payload.share_path);
              await copyText(url);
              const open = node('a', '', 'Open');
              open.href = url;
              open.target = '_blank';
              open.rel = 'noopener';
              actionStatus.replaceChildren(
                document.createTextNode(
                  payload.overlay
                    ? 'Link copied · synchronized overlay included ·'
                    : 'Link copied · original video ·',
                ),
                open,
              );
            } catch (error) {
              actionStatus.className = 'action-status error';
              actionStatus.textContent = `Share failed · ${error.message}`;
            } finally {
              share.disabled = false;
            }
          });
          addToGallery.addEventListener('click', async () => {
            const state = galleryStates.get(galleryKey);
            if (
              state?.status === 'adding'
              || state?.status === 'added'
              || state?.status === 'duplicate'
            ) {
              return;
            }
            galleryStates.set(galleryKey, { status: 'adding' });
            applyGalleryState(
              addToGallery,
              actionStatus,
              galleryStates.get(galleryKey),
            );
            try {
              const payload = await requestJson(
                `${casePath(session.latestVideo)}/gallery`,
                {},
              );
              const duplicate = payload.added === false
                || payload.duplicate === true
                || ['duplicate', 'exists'].includes(
                  String(payload.status || '').toLowerCase(),
                );
              galleryStates.set(galleryKey, {
                status: duplicate ? 'duplicate' : 'added',
              });
            } catch (error) {
              galleryStates.set(
                galleryKey,
                error.status === 409
                  ? { status: 'duplicate' }
                  : { status: 'failed', message: error.message },
              );
            }
            applyGalleryState(
              addToGallery,
              actionStatus,
              galleryStates.get(galleryKey),
            );
          });
          download.addEventListener('click', () => {
            pendingDownload = session.latestVideo;
            downloadStatus.className = 'action-status';
            downloadStatus.textContent = '';
            downloadModes.forEach(input => { input.checked = input.value === 'overlay'; });
            confirmDownload.textContent = 'Download with overlay';
            downloadDialog.showModal();
          });
          actions.append(share, download, addToGallery, actionStatus);
          body.append(actions);
        }
        const timeline = node('div', 'turn-list');
        session.attempts.forEach((item, index) => {
          const turn = document.createElement('details');
          turn.className = 'turn';
          turn.open = index === session.attempts.length - 1;
          const heading = document.createElement('summary');
          heading.append(
            node('span', 'turn-number', String(index + 1)),
            node('span', 'turn-title', actionText(item)),
            node('span', `turn-state status-${item.status}`, item.status || 'unknown'),
          );
          const turnBody = node('div', 'turn-body');
          turnBody.append(node('p', 'environment', fmt(item.created_at)));
          if (item.prompt_enhancement?.mode) {
            turnBody.append(node(
              'p',
              'environment',
              `Prompt enhancer: ${item.prompt_enhancement.mode}`,
            ));
          }
          if (Number.isInteger(item.prompt_enhancement?.seed)) {
            const source = item.prompt_enhancement?.seed_source === 'generated'
              ? 'auto-generated'
              : item.prompt_enhancement?.seed_source === 'provided'
                ? 'provided'
                : 'recorded';
            turnBody.append(node(
              'p',
              'environment',
              `LLM seed: ${item.prompt_enhancement.seed} (${source})`,
            ));
          }
          if (item.prompt_enhancement?.fallback_reason) {
            turnBody.append(node(
              'p',
              'environment',
              `Fallback reason: ${item.prompt_enhancement.fallback_reason}`,
            ));
          }
          if (item.error) turnBody.append(node('p', 'error', item.error));
          if (item.video_url && card._video) {
            const actions = node('div', 'turn-actions');
            const play = node('button', '', 'Play this result');
            play.type = 'button';
            play.addEventListener('click', event => {
              event.preventDefault();
              const source = mediaUrl(item.video_url);
              if (card._video.src !== source) {
                card._video.src = source;
                card._video.load();
              }
              card._video.play().catch(error => {
                console.error('Video playback failed', error);
              });
              card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            actions.append(play);
            turnBody.append(actions);
          }
          turnBody.append(
            details('Original user input', item.prompts?.original_user_input),
            details('K3 enhanced prompt', item.prompts?.k3_enhanced_prompt),
            details('Final model prompt', item.prompts?.final_model_prompt),
            details('Paths and result metadata', {
              job_id: item.job_id,
              artifacts: item.artifacts,
              result: item.result,
            }),
          );
          turn.append(heading, turnBody);
          timeline.append(turn);
        });
        body.append(timeline);
        card.append(body);
        grid.append(card);
      }
      requestAnimationFrame(() => {
        const target = grid.querySelector('.focused-case');
        if (target && target.dataset.focused !== '1') {
          target.dataset.focused = '1';
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    }
    function scheduleRefresh(delay = refreshIntervalMs) {
      clearTimeout(refreshTimer);
      if (!document.hidden) refreshTimer = setTimeout(refresh, delay);
    }
    async function refresh() {
      if (refreshInFlight) {
        refreshPending = true;
        return;
      }
      if (document.hidden) return;
      refreshInFlight = true;
      const params = new URLSearchParams({
        page: String(currentPage),
        page_size: String(pageSize),
      });
      const query = search.value.trim();
      if (query) params.set('search', query);
      if (status.value) params.set('status', status.value);
      try {
        const response = await fetch(`${appRoot}v1/cases?${params}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const nextDigest = JSON.stringify(data.items);
        if (nextDigest !== digest) {
          latestData = {
            items: data.items || [],
            total: data.total || 0,
            session_total: data.session_total || 0,
            page: data.page || 1,
            pages: data.pages || 0,
          };
          currentPage = latestData.page;
          const videoPlaying = [...grid.querySelectorAll('video')]
            .some(video => !video.paused && !video.ended);
          if (!videoPlaying) {
            digest = nextDigest;
            render();
          }
        }
        liveText.textContent = `Live · updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        liveText.textContent = `Update failed · ${error.message}`;
      } finally {
        refreshInFlight = false;
        if (refreshPending) {
          refreshPending = false;
          scheduleRefresh(0);
        } else {
          scheduleRefresh();
        }
      }
    }
    search.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        currentPage = 1;
        refresh();
      }, 250);
    });
    status.addEventListener('change', () => {
      currentPage = 1;
      refresh();
    });
    previousPage.addEventListener('click', () => {
      if (currentPage <= 1) return;
      currentPage -= 1;
      refresh();
    });
    nextPage.addEventListener('click', () => {
      if (latestData.pages && currentPage >= latestData.pages) return;
      currentPage += 1;
      refresh();
    });
    downloadModes.forEach(input => input.addEventListener('change', () => {
      confirmDownload.textContent = input.value === 'overlay' && input.checked
        ? 'Download with overlay'
        : document.querySelector('input[name="downloadMode"]:checked')?.value === 'original'
          ? 'Download original video'
          : confirmDownload.textContent;
    }));
    cancelDownload.addEventListener('click', () => downloadDialog.close());
    confirmDownload.addEventListener('click', async () => {
      if (!pendingDownload) return;
      const includeOverlay =
        document.querySelector('input[name="downloadMode"]:checked')?.value !== 'original';
      confirmDownload.disabled = true;
      cancelDownload.disabled = true;
      downloadStatus.className = 'action-status';
      downloadStatus.textContent = includeOverlay
        ? 'Preparing overlay MP4…'
        : 'Preparing Original video…';
      try {
        const payload = await requestJson(
          `${casePath(pendingDownload)}/downloads`,
          { include_overlay: includeOverlay, theme: 'dark' },
        );
        triggerDownload(payload.download_path, payload.filename);
        downloadDialog.close();
        if (payload.fallback_reason) window.alert(payload.fallback_reason);
      } catch (error) {
        downloadStatus.className = 'action-status error';
        downloadStatus.textContent = `Download failed · ${error.message}`;
      } finally {
        confirmDownload.disabled = false;
        cancelDownload.disabled = false;
      }
    });
    window.addEventListener('popstate', refresh);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(refreshTimer);
      } else {
        refresh();
      }
    });
    refresh();
  </script>
</body>
</html>
